services:
  mqtt-atmowx-bridge:
    build: .
    image: mqtt-atmowx-bridge:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      # Keeps the session across restarts, so the app password is only used once.
      - bridge-data:/data
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4).status == 200 else 1)"
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  bridge-data:
