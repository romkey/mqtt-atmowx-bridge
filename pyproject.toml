[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mqtt-atmowx-bridge"
version = "0.1.0"
description = "Publish weather observations from MQTT to the AT Protocol as net.atmowx.observation records"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["mqtt", "weather", "atproto", "bluesky", "atmowx", "weather-station"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
  "paho-mqtt>=2.1",
  "httpx>=0.27",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-timeout>=2.3",
  "mypy>=1.10",
  "ruff>=0.5",
  "types-PyYAML",
]

[project.scripts]
mqtt-atmowx-bridge = "mqtt_atmowx_bridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mqtt_atmowx_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "BLE", "SLF", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests reach into internals to assert on state that has no public accessor.
"tests/*" = ["SLF001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
files = ["mqtt_atmowx_bridge", "tests"]

[[tool.mypy.overrides]]
module = ["paho.*"]
ignore_missing_imports = true
